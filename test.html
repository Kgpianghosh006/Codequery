<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeQuery — search DSA problems across LeetCode, Codeforces, AtCoder and more in one place." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>CodeQuery — Search DSA problems, instantly</title>
  </head>
  <body>
    <div class="container">
      <header class="hero-content">
        <p class="eyebrow">// index of leetcode · codeforces · atcoder</p>
        <h1>CodeQuery</h1>
        <h2>Search your DSA problems in seconds</h2>
        <p class="tagline">
          Instantly find coding challenges across
          <img
            src="assets/logos/codeforces.png"
            alt="Codeforces"
            class="platform-icon"
          />
          <img
            src="assets/logos/AtCoder.png"
            alt="AtCoder"
            class="platform-icon"
          />
          <img
            src="assets/logos/leetcode.png"
            alt="LeetCode"
            class="platform-icon"
          />
          —all in one place.
        </p>
      </header>

      <form class="search-form" id="search-form">
        <label class="prompt-wrap" for="query-input">
          <span class="prompt-glyph" aria-hidden="true">&gt;</span>
          <input
            id="query-input"
            class="query-input"
            type="text"
            placeholder="Enter problem name"
            autocomplete="off"
          />
        </label>
        <button type="submit">Search</button>
      </form>

      <p class="cta">Type a topic, tag, or title above to begin your search.</p>

      <div id="spinner" class="spinner hidden" aria-hidden="true"></div>

      <div id="results" class="results"></div>
    </div>

    <footer class="site-footer">
      <p>
        &copy; 2025 CodeQuery — Developed by
        <a href="https://github.com/Kgpianghosh006/Codequery" target="_blank" rel="noopener noreferrer">Avik Ghosh</a>
      </p>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
